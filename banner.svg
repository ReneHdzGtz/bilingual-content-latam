<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF444420"/>
      <stop offset="100%" style="stop-color:#dc262600"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="url(#glow)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/><line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
  </g>
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>
  <!-- Globe/map decoration -->
  <circle cx="1050" cy="190" r="110" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="190" r="80" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="190" r="50" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.1"/>
  <!-- Latitude lines -->
  <ellipse cx="1050" cy="190" rx="110" ry="40" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.12"/>
  <ellipse cx="1050" cy="190" rx="110" ry="75" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.08"/>
  <!-- Dots on globe -->
  <circle cx="990" cy="155" r="4" fill="#EF4444" opacity="0.7"/>
  <circle cx="1020" cy="210" r="3" fill="#dc2626" opacity="0.6"/>
  <circle cx="1080" cy="170" r="4" fill="#EF4444" opacity="0.65"/>
  <!-- Badge -->
  <rect x="80" y="100" width="130" height="28" rx="14" fill="#EF444420" stroke="#EF4444" stroke-width="1"/>
  <text x="145" y="119" font-family="monospace" font-size="12" fill="#EF4444" text-anchor="middle">SKILL.md</text>
  <!-- Title -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Bilingual Content</text>
  <text x="80" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#EF4444" letter-spacing="-1">LATAM</text>
  <text x="80" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8b949e">Create and localize content for MX, CO, ARG &amp; LATAM — not just translated</text>
  <rect x="80" y="340" width="88" height="24" rx="12" fill="#EF444410" stroke="#EF444440" stroke-width="1"/>
  <text x="124" y="357" font-family="monospace" font-size="11" fill="#EF4444" text-anchor="middle">6 modules</text>
  <rect x="180" y="340" width="90" height="24" rx="12" fill="#EF444410" stroke="#EF444440" stroke-width="1"/>
  <text x="225" y="357" font-family="monospace" font-size="11" fill="#EF4444" text-anchor="middle">EN + ES</text>
  <rect x="282" y="340" width="100" height="24" rx="12" fill="#EF444410" stroke="#EF444440" stroke-width="1"/>
  <text x="332" y="357" font-family="monospace" font-size="11" fill="#EF4444" text-anchor="middle">OpenClaw</text>
</svg>
